<title>Legl regulation tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: quiet nav (country picker top right) → question + ask box that answers in place → key-dates timeline (past ● Today ○ future) → filters as plain text → one list panel with a date column → detail drawer. Tokens follow the new legl.com. */
:root {
  --page: #F7F8FA;
  --card: #FFFFFF;
  --sunk: #EEF0F3;
  --line: #E5E7EB;
  --line-strong: #CDD2D9;
  --ink: #1B1B1B;
  --body: #3F444B;
  --muted: #6B7280;
  --green: #018568;
  --green-mid: #01B890;
  --green-surface: #E6F8F4;
  --green-tint: #CCF1E9;
  --glow: rgba(1, 184, 144, 0.10);
  --amber: #8A5C00;
  --amber-surface: #FFF3D6;
  --indigo: #4F46E5;
  --indigo-surface: #EFEEFF;
  --blue: #00739F;
  --blue-surface: #EBF9FF;
  --btn: #1B1B1B;
  --btn-ink: #FFFFFF;
  --logo: #01B88E;
  --scrim: rgba(17, 18, 19, 0.35);
  --float: 0 12px 32px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.06);
  --box: 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 30px rgba(16, 24, 40, 0.07);
  --font: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111213;
    --card: #1A1C1F;
    --sunk: #23262A;
    --line: #2B2E33;
    --line-strong: #3E4248;
    --ink: #F2F2F2;
    --body: #CDD0D5;
    --muted: #9AA0A8;
    --green: #4DCDB1;
    --green-mid: #01B890;
    --green-surface: #12302A;
    --green-tint: #174036;
    --glow: rgba(1, 184, 144, 0.10);
    --amber: #F0C060;
    --amber-surface: #33280F;
    --indigo: #A7A3F2;
    --indigo-surface: #24213F;
    --blue: #70D4FF;
    --blue-surface: #0F2A36;
    --btn: #F2F2F2;
    --btn-ink: #111213;
    --logo: #FFFFFF;
    --scrim: rgba(0, 0, 0, 0.55);
    --float: 0 12px 32px rgba(0, 0, 0, 0.5);
    --box: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111213;
  --card: #1A1C1F;
  --sunk: #23262A;
  --line: #2B2E33;
  --line-strong: #3E4248;
  --ink: #F2F2F2;
  --body: #CDD0D5;
  --muted: #9AA0A8;
  --green: #4DCDB1;
  --green-mid: #01B890;
  --green-surface: #12302A;
  --green-tint: #174036;
  --glow: rgba(1, 184, 144, 0.10);
  --amber: #F0C060;
  --amber-surface: #33280F;
  --indigo: #A7A3F2;
  --indigo-surface: #24213F;
  --blue: #70D4FF;
  --blue-surface: #0F2A36;
  --btn: #F2F2F2;
  --btn-ink: #111213;
  --logo: #FFFFFF;
  --scrim: rgba(0, 0, 0, 0.55);
  --float: 0 12px 32px rgba(0, 0, 0, 0.5);
  --box: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--page);
  color: var(--body);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
h1, h2, h3, h4 { color: var(--ink); font-weight: 600; margin: 0; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
a { color: var(--green); text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green-mid); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; }

/* Nav */
.nav .wrap { max-width: 1120px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 500; min-width: 0; }
.brand svg { width: 44px; height: auto; color: var(--logo); flex: none; }
.brand .sep { width: 1px; height: 18px; background: var(--line-strong); flex: none; }
.brand span:last-child { white-space: nowrap; }
.country { position: relative; }
.country-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px 7px 10px; font-size: 14px; font-weight: 500; color: var(--ink); }
.country-btn:hover { border-color: var(--line-strong); }
.country-btn svg { width: 16px; height: 16px; color: var(--muted); }
.country-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--float); padding: 6px; min-width: 200px; z-index: 30; }
.country-menu button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; font-size: 15px; color: var(--ink); }
.country-menu button:hover { background: var(--sunk); }
.country-menu .tick { width: 16px; height: 16px; color: var(--green); }

/* Hero + ask */
.hero { padding-block: 64px 8px; background: radial-gradient(60% 120% at 50% 0%, var(--glow), transparent 70%); }
.hero h1 { font-size: clamp(30px, 4.8vw, 46px); letter-spacing: -0.035em; text-align: center; }
.ask { margin: 28px auto 0; max-width: 680px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--box); overflow: hidden; }
.ask:focus-within { border-color: var(--line-strong); }
.qa { padding: 18px 20px 16px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.qa-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.qa-q { font-size: 14px; color: var(--muted); padding-top: 4px; }
.qa-x { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 0; background: var(--sunk); color: var(--muted); display: grid; place-items: center; }
.qa-x:hover { color: var(--ink); }
.qa-x svg { width: 14px; height: 14px; }
.qa-a { display: grid; gap: 10px; color: var(--ink); font-size: 15px; }
.qa-a ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.qa-a .sub { color: var(--muted); }
.qa-src { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qa-src span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.src-link { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink); }
.src-link:hover { border-color: var(--green); color: var(--green); }
.thinking { color: var(--muted); font-size: 14px; }
.ask-row { display: flex; align-items: flex-end; gap: 12px; padding: 14px 14px 14px 20px; }
.ask textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font-size: 17px; line-height: 1.5; min-height: 56px; color: var(--ink); padding: 2px 0; }
.ask.answered textarea { min-height: 28px; font-size: 16px; }
.ask textarea::placeholder { color: var(--muted); }
.send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; flex: none; }
.send svg { width: 18px; height: 18px; }
.send:hover { opacity: 0.85; }
.suggest { margin: 14px auto 0; max-width: 680px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.suggest button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 14px; color: var(--muted); }
.suggest button:hover { border-color: var(--line-strong); color: var(--ink); }

/* Section heads */
.sec { padding-top: 56px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
.sec-head h2 { font-size: 20px; }
.sec-head p { font-size: 14px; color: var(--muted); }

/* Key dates timeline */
.kd-wrap { display: grid; }
.kd { position: relative; text-align: left; background: none; border: 0; padding: 26px 18px 0 0; display: grid; gap: 2px; align-content: start; color: inherit; }
.kd::before { content: ""; position: absolute; top: 7px; left: 0; right: 0; height: 2px; background: var(--green-mid); }
.kd.future::before { background: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 11px); }
.kd .dot { position: absolute; top: 1px; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--green-mid); box-shadow: 0 0 0 4px var(--page); }
.kd.future .dot { background: var(--page); border: 2px solid var(--indigo); }
.kd .lbl { font-size: 12px; color: var(--green); font-weight: 500; }
.kd.future .lbl { color: var(--indigo); }
.kd b { font-size: 16px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
.kd span.t { font-size: 14px; color: var(--body); line-height: 1.4; }
.kd small { font-size: 12px; color: var(--muted); }
.kd:hover b, .kd:hover span.t { color: var(--green); }
.today { position: relative; padding: 26px 0 0; display: grid; justify-items: center; align-content: start; }
.today::before { content: ""; position: absolute; top: 7px; left: 0; right: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 11px); }
.today::after { content: ""; position: absolute; top: -4px; left: 50%; width: 2px; height: 24px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.today b { font-size: 12px; color: var(--ink); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.today small { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Filters (plain, no box) */
.tabs-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0 11px; margin-bottom: -1px; font-size: 15px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button .n { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.selects { display: flex; gap: 16px; padding-bottom: 6px; }
.sel { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.sel select { border: 0; background: transparent; font-size: 14px; color: var(--ink); font-weight: 500; padding: 4px 18px 4px 0; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 9px) 55%, calc(100% - 4px) 55%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; field-sizing: content; max-width: 100%; }
.sel { min-width: 0; }
.firm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 16px 18px; }
.firm-label { font-size: 14px; color: var(--muted); margin-right: 4px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--body); }
.fchip:hover { border-color: var(--line-strong); }
.fchip svg { width: 13px; height: 13px; display: none; }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.fchip[aria-pressed="true"] svg { display: block; }
.clear { background: none; border: 0; padding: 0 4px; font-size: 14px; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }

/* List panel */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.panel-head { display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; padding: 10px 22px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.row { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; padding: 20px 22px; align-items: start; }
.row:hover { background: var(--page); }
.row:last-child { border-bottom: 0; }
.when { display: grid; gap: 0; padding-top: 1px; }
.when b { font-size: 17px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.when small { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.what { display: grid; gap: 5px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.what h3 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.what p { font-size: 15px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.applies { font-size: 13px; color: var(--muted); }
.applies b { color: var(--body); font-weight: 500; }
.go { width: 18px; height: 18px; color: var(--line-strong); margin-top: 3px; }
.row:hover .go { color: var(--ink); }
.more-btn { width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--card); padding: 16px; font-size: 14px; font-weight: 500; color: var(--ink); }
.more-btn:hover { background: var(--page); }
.empty { padding: 36px 22px; text-align: center; color: var(--muted); font-size: 15px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.s0 { background: var(--amber-surface); color: var(--amber); }
.pill.s1 { background: var(--indigo-surface); color: var(--indigo); }
.pill.s2 { background: var(--green-surface); color: var(--green); }
.pill.sg { background: var(--blue-surface); color: var(--blue); }

footer { padding-block: 40px 56px; }
footer p { font-size: 13px; color: var(--muted); max-width: 72ch; }
footer p + p { margin-top: 6px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--card); z-index: 41; box-shadow: var(--float); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.drawer-bar .crumb { font-size: 13px; color: var(--muted); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink); }
.x svg { width: 16px; height: 16px; }
.x:hover { border-color: var(--ink); }
.drawer-body { overflow-y: auto; padding: 24px 24px 32px; display: grid; gap: 24px; align-content: start; }
.d-head { display: grid; gap: 10px; }
.d-head h2 { font-size: 26px; letter-spacing: -0.03em; }
.d-head .short { font-size: 16px; color: var(--body); }
.d-sec h4, .who h4 { font-size: 12px; font-family: var(--mono); font-weight: 400; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
.d-sec ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); }
.who { background: var(--sunk); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.who h4 { margin: 0; }
.who p { color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; background: var(--card); color: var(--body); border-radius: 6px; padding: 2px 8px; }
.tag.all { background: var(--green-surface); color: var(--green); }
.timeline { display: grid; grid-template-columns: repeat(3, 1fr); }
.t-step { position: relative; padding: 20px 8px 0 0; }
.t-step::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 2px; background: var(--line); }
.t-step::after { content: ""; position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--line-strong); }
.t-step.on::before { background: var(--green-mid); }
.t-step.on::after { background: var(--green-mid); border-color: var(--green-mid); }
.t-step.now::after { box-shadow: 0 0 0 4px var(--green-tint); }
.t-step b { display: block; font-size: 14px; color: var(--ink); font-weight: 500; }
.t-step span { font-size: 13px; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
.src-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.src-row span { font-size: 13px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 9px 16px; font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn-dark { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.btn-dark:hover { opacity: 0.88; }
.btn svg { width: 14px; height: 14px; }
.hook { background: var(--green-surface); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.hook p { color: var(--ink); font-size: 15px; }
.hook .row-end { display: flex; justify-content: flex-end; }

@media (max-width: 640px) {
  .hero { padding-block: 40px 4px; }
  .brand span:last-child, .brand .sep { display: none; }
  .kd-wrap { grid-template-columns: 1fr !important; }
  .kd { padding: 0 0 20px 30px; }
  .kd::before { top: 0; bottom: 0; left: 6px; right: auto; width: 2px; height: auto; }
  .kd.future::before { background: repeating-linear-gradient(180deg, var(--line-strong) 0 6px, transparent 6px 11px); }
  .kd .dot { top: 3px; }
  .today { padding: 4px 0 20px 30px; justify-items: start; grid-auto-flow: column; gap: 8px; align-items: baseline; justify-content: start; }
  .today::before { top: 0; bottom: 0; left: 6px; right: auto; width: 2px; height: auto; background: repeating-linear-gradient(180deg, var(--line-strong) 0 6px, transparent 6px 11px); }
  .today::after { top: 12px; left: -2px; width: 18px; height: 2px; margin-left: 0; }
  .selects { width: 100%; flex-wrap: wrap; gap: 8px 20px; padding-bottom: 10px; }
  .panel-head { display: none; }
  .row { grid-template-columns: 1fr auto; padding: 18px 16px; gap: 8px 10px; }
  .when { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; gap: 6px; align-items: baseline; }
  .when b { font-size: 14px; }
  .go { grid-column: 2; grid-row: 2; }
  .drawer-body { padding: 20px 16px 28px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .qa { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>

  function words(q) { return q.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9$£/ -]/g, ' ').split(/\s+/).filter(function (w) { return w.length > 2 && !STOP[w]; }); }
  function hay(r) { return [r.reg, r.topic, r.title, r.short, r.who, r.changes.join(' '), STAGE[r.stage]].join(' ').toLowerCase(); }

  function filtered() {
    var list = mine().filter(function (r) {
      if (state.stage !== 'all' && sk(r) !== state.stage) return false;
      if (state.topic !== 'all' && r.topic !== state.topic) return false;
      if (state.firm.length && r.applies.indexOf('all') === -1 && !r.applies.some(function (k) { return state.firm.indexOf(k) !== -1; })) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (state.sort === 'soon') {
        var ae = a.eff && a.eff >= TODAY ? a.eff : '9999', be = b.eff && b.eff >= TODAY ? b.eff : '9999';
        if (ae !== be) return ae < be ? -1 : 1;
      }
      return a.date < b.date ? 1 : -1;
    });
    return list;
  }

  /* Render */
  function renderTop() {
    var C = COUNTRY[state.c];
    $('country-name').textContent = C.name;
    $('hero-title').textContent = 'What’s changed in ' + C.adj + ' legal regulation?';
    if (!$('ask').classList.contains('answered')) $('q').placeholder = C.placeholder;
    $('checked').textContent = 'Checked ' + fmt(TODAY);
    $('sources-line').textContent = 'Sources: ' + C.sources + '.';
    document.querySelectorAll('[data-country]').forEach(function (b) {
      var on = b.getAttribute('data-country') === state.c;
      b.querySelector('.tick').style.visibility = on ? 'visible' : 'hidden';
      b.setAttribute('aria-checked', String(on));
    });
    $('suggest').innerHTML = C.suggest.map(function (s, i) { return '<button type="button" data-suggest="' + i + '">' + esc(s.q) + '</button>'; }).join('');
  }

  function renderKeyDates() {
    var key = COUNTRY[state.c].key;
    $('kd').style.gridTemplateColumns = key.map(function (k) { return k === 'today' ? '84px' : 'minmax(0, 1fr)'; }).join(' ');
    var tp = TODAY.split('-');
    $('kd').innerHTML = key.map(function (k) {
      if (k === 'today') return '<div class="today" aria-label="Today"><b>Today</b><small>' + (+tp[2]) + ' ' + MONTHS[+tp[1] - 1] + '</small></div>';
      return '<button type="button" class="kd' + (k.future ? ' future' : '') + '" data-open="' + k.id + '"><span class="dot"></span>' +
        '<span class="lbl">' + (k.future ? 'Coming up' : 'In force') + '</span><b>' + esc(k.d) + '</b><span class="t">' + esc(k.t) + '</span><small>' + esc(k.reg) + '</small></button>';
    }).join('');
  }

  function renderFilters() {
    var all = mine();
    var counts = { all: all.length, '2': 0, '1': 0, '0': 0, g: 0 };
    all.forEach(function (r) { counts[sk(r)]++; });
    var tabs = [['all', 'All'], ['2', 'In force'], ['1', 'Decided'], ['0', 'Proposed'], ['g', 'Guidance']];
    $('tabs').innerHTML = tabs.filter(function (t) { return t[0] === 'all' || counts[t[0]]; }).map(function (t) {
      return '<button type="button" data-stage="' + t[0] + '" aria-pressed="' + (state.stage === t[0]) + '">' + t[1] + '<span class="n">' + counts[t[0]] + '</span></button>';
    }).join('');
    var topics = {};
    all.forEach(function (r) { topics[r.topic] = true; });
    var tl = Object.keys(topics).sort();
    if (state.topic !== 'all' && tl.indexOf(state.topic) === -1) state.topic = 'all';
    $('topic').innerHTML = '<option value="all">All</option>' + tl.map(function (t) { return '<option' + (t === state.topic ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
    $('sort').value = state.sort;
    var tick = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
    var any = state.stage !== 'all' || state.topic !== 'all' || state.firm.length || state.sort !== 'recent';
    $('firm').innerHTML = '<span class="firm-label">My firm does this:</span>' + COUNTRY[state.c].firm.map(function (f) {
      return '<button type="button" class="fchip" data-firm="' + f.k + '" aria-pressed="' + (state.firm.indexOf(f.k) !== -1) + '">' + tick + esc(f.label) + '</button>';
    }).join('') + (any ? '<button type="button" class="clear" id="clear">Clear</button>' : '');
  }

  function renderList() {
    var list = filtered();
    var A = COUNTRY[state.c].applies;
    var arrow = '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
    if (!list.length) { $('list').innerHTML = '<div class="empty">No changes match. Try removing a filter.</div>'; return; }
    var rows = list.slice(0, state.shown).map(function (r) {
      var eff = effectLine(r);
      return '<button type="button" class="row" data-open="' + r.id + '">' +
        '<span class="when">' + dateCol(r) + '</span>' +
        '<span class="what"><span class="meta">' + pill(r) + '<span>' + esc(r.reg) + (eff ? ' · ' + esc(eff) : '') + '</span></span>' +
        '<h3>' + esc(r.title) + '</h3><p>' + esc(r.short) + '</p>' +
        '<span class="applies">Applies to <b>' + r.applies.map(function (k) { return esc(A[k]); }).join(', ') + '</b></span></span>' +
        arrow + '</button>';
    }).join('');
    var left = list.length - state.shown;
    $('list').innerHTML = rows + (left > 0 ? '<button type="button" class="more-btn" id="more">Show ' + Math.min(left, PAGE) + ' more</button>' : '');
  }

  function renderAll() { renderTop(); renderKeyDates(); renderFilters(); renderList(); }

  /* Drawer */
  function openDrawer(id) {
    var r = byId(id);
    if (!r) return;
    state.lastFocus = document.activeElement;
    var A = COUNTRY[r.c].applies;
    var eff = r.stage === 1 ? cap(r.effect) : r.effect;
    var timeline;
    if (r.steps) {
      var labels = ['Proposed', 'Decided', 'In force'];
      timeline = '<div class="d-sec"><h4>Where it is</h4><div class="timeline">' + labels.map(function (l, i) {
        return '<div class="t-step' + (i <= r.stage ? ' on' : '') + (i === r.stage ? ' now' : '') + '"><b>' + l + '</b><span>' + esc(r.steps[i] || '—') + '</span></div>';
      }).join('') + '</div></div>';
    } else {
      timeline = '<p class="note">This is guidance, not a new rule. It explains how the regulator expects firms to act.</p>';
    }
    var headDate = r.dateLabel ? r.dateLabel.join(' ').trim() : fmt(r.date);
    $('drawer').innerHTML =
      '<div class="drawer-bar"><span class="crumb">' + esc(COUNTRY[r.c].name) + ' · ' + esc(r.reg) + '</span>' +
      '<button type="button" class="x" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
      '<div class="drawer-body">' +
        '<div class="d-head"><div class="meta">' + pill(r) + '<span>' + esc(headDate) + '</span></div><h2 id="d-title">' + esc(r.title) + '</h2><p class="short">' + esc(r.short) + '</p></div>' +
        '<div class="who"><h4>Who it applies to</h4><p>' + esc(r.who) + '</p>' +
          '<div class="tags">' + r.applies.map(function (k) { return '<span class="tag' + (k === 'all' ? ' all' : '') + '">' + esc(A[k]) + '</span>'; }).join('') + '</div></div>' +
        timeline +
        '<div class="d-sec"><h4>What changes</h4><ul>' + r.changes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="src-row"><span>Takes effect: ' + esc(eff) + ' · Checked ' + fmt(TODAY) + '</span>' +
          '<a class="btn" href="' + esc(r.src) + '" target="_blank" rel="noopener">Read on ' + esc(r.srcName) + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a></div>' +
        '<div class="hook"><p>Getting your firm ready for changes like this? Legl helps law firms onboard clients, run AML checks and take payments in one place.</p><div class="row-end"><a class="btn btn-dark" href="https://www.legl.com" target="_blank" rel="noopener">See how Legl helps</a></div></div>' +
      '</div>';
    $('drawer').hidden = false;
    $('scrim').hidden = false;
    document.body.classList.add('locked');
    $('close').focus();
  }
  function closeDrawer() {
    $('drawer').hidden = true;
    $('scrim').hidden = true;
    document.body.classList.remove('locked');
    if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus();
  }

  /* Ask: the answer appears inside the box */
  function answerFor(q, preset) {
    var C = COUNTRY[state.c];
    var intent = preset && preset.intent;
    var lower = q.toLowerCase();
    if (!intent && !(preset && preset.ids)) {
      if (/coming up|upcoming|deadline|soon|next/.test(lower)) intent = 'soon';
      else if (/consult|propos|draft/.test(lower)) intent = 'proposed';
    }
    if (intent === 'soon') {
      var f = C.key.filter(function (k) { return k !== 'today' && k.future; });
      return { html: '<ul>' + f.map(function (k) { return '<li><b>' + esc(k.d) + '</b>: ' + esc(k.t) + ' <span class="sub">(' + esc(k.reg) + ')</span></li>'; }).join('') + '</ul>', ids: f.map(function (k) { return k.id; }) };
    }
    if (intent === 'proposed') {
      var p = mine().filter(function (r) { return r.stage === 0; });
      return { html: '<p>' + p.length + ' proposal' + (p.length === 1 ? ' is' : 's are') + ' open or awaiting a decision:</p><ul>' + p.map(function (r) { return '<li>' + esc(r.title) + ' <span class="sub">(' + esc(r.reg) + ')</span></li>'; }).join('') + '</ul>', ids: p.map(function (r) { return r.id; }) };
    }
    var picked;
    if (preset && preset.ids) picked = preset.ids.map(byId);
    else {
      var ws = words(q);
      picked = mine().map(function (r) {
        var h = hay(r), s = 0;
        ws.forEach(function (w) { if (h.indexOf(w) !== -1) s += r.title.toLowerCase().indexOf(w) !== -1 ? 3 : 1; });
        return { r: r, s: s };
      }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 3).map(function (x) { return x.r; });
    }
    if (!picked.length) return { html: '<p>Nothing in the tracker covers that yet. It only answers from changes it holds, so it won’t guess.</p>', ids: [] };
    return {
      html: picked.map(function (r) { return '<p><b>' + esc(r.title) + '.</b> ' + esc(r.short) + '</p>'; }).join(''),
      ids: picked.map(function (r) { return r.id; })
    };
  }

  function ask(q, preset) {
    q = q.trim();
    if (!q) return;
    $('ask').classList.add('answered');
    $('qa').hidden = false;
    $('qa-q').textContent = q;
    $('qa-a').innerHTML = '<p class="thinking">Reading the tracker…</p>';
    $('q').value = '';
    $('q').rows = 1;
    $('q').placeholder = 'Ask a follow-up';
    $('suggest').hidden = true;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () {
      var a = answerFor(q, preset);
      var src = a.ids.length ? '<div class="qa-src"><span>Sources</span>' + a.ids.map(function (id) {
        var r = byId(id);
        return '<button type="button" class="src-link" data-open="' + id + '">' + esc(r.title.length > 40 ? r.title.slice(0, 38) + '…' : r.title) + '</button>';
      }).join('') + '</div>' : '';
      $('qa-a').innerHTML = a.html + src;
    }, reduce ? 0 : 450);
  }
  function resetAsk() {
    $('ask').classList.remove('answered');
    $('qa').hidden = true;
    $('q').rows = 2;
    $('q').value = '';
    $('q').placeholder = COUNTRY[state.c].placeholder;
    $('suggest').hidden = false;
  }

  /* Country */
  function setCountry(c) {
    if (!COUNTRY[c]) return;
    state.c = c; state.stage = 'all'; state.topic = 'all'; state.firm = []; state.sort = 'recent'; state.shown = PAGE;
    try { localStorage.setItem('legl-tracker-country', c); } catch (e) {}
    resetAsk();
    renderAll();
  }
  function toggleMenu(open) {
    $('country-menu').hidden = !open;
    $('country-btn').setAttribute('aria-expanded', String(open));
  }

  /* Events */
  $('country-btn').addEventListener('click', function (e) { e.stopPropagation(); toggleMenu($('country-menu').hidden); });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(e.target.value, null); } });
  $('ask').addEventListener('submit', function (e) { e.preventDefault(); ask($('q').value, null); });
  $('topic').addEventListener('change', function (e) { state.topic = e.target.value; state.shown = PAGE; renderFilters(); renderList(); });
  $('sort').addEventListener('change', function (e) { state.sort = e.target.value; state.shown = PAGE; renderFilters(); renderList(); });
  $('scrim').addEventListener('click', closeDrawer);

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest('.country')) toggleMenu(false);
    var cb = t.closest('[data-country]');
    if (cb) { toggleMenu(false); setCountry(cb.getAttribute('data-country')); return; }
    var sg = t.closest('[data-suggest]');
    if (sg) { var s = COUNTRY[state.c].suggest[+sg.getAttribute('data-suggest')]; ask(s.q, s); return; }
    if (t.closest('#qa-x')) { resetAsk(); $('q').focus(); return; }
    var op = t.closest('[data-open]');
    if (op) { openDrawer(op.getAttribute('data-open')); return; }
    if (t.closest('#close')) { closeDrawer(); return; }
    var st = t.closest('[data-stage]');
    if (st) { state.stage = st.getAttribute('data-stage'); state.shown = PAGE; renderFilters(); renderList(); return; }
    var fm = t.closest('[data-firm]');
    if (fm) {
      var k = fm.getAttribute('data-firm'), i = state.firm.indexOf(k);
      if (i === -1) state.firm.push(k); else state.firm.splice(i, 1);
      state.shown = PAGE; renderFilters(); renderList(); return;
    }
    if (t.closest('#clear')) { state.stage = 'all'; state.topic = 'all'; state.firm = []; state.sort = 'recent'; state.shown = PAGE; renderFilters(); renderList(); return; }
    if (t.closest('#more')) { state.shown += PAGE; renderList(); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { toggleMenu(false); if (!$('drawer').hidden) closeDrawer(); }
  });

  var start = 'uk';
  var h = (location.hash || '').replace('#', '');
  if (COUNTRY[h]) start = h;
  else { try { var saved = localStorage.getItem('legl-tracker-country'); if (COUNTRY[saved]) start = saved; } catch (e) {} }
  state.c = start;
  renderAll();
})();
</script>
